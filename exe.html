<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }
        body{
            height: 100vh;
            background-color: yellow;
            display: flex;
            justify-content: space-between;
        }
        #div1{
            height: 200px;
            width: 200px;
            background-color: black;
        }
        #div2{
            height: 200px;
            width: 200px;
            background-color: white;
            
            display: flex;
            flex-direction: column;
            align-self: end;
        }
    </style>
</head>
<body>
    <div id="div1"></div>
    <div id="div2"></div>
</body>
</html>
